# Alembic 配置。
# 数据库 URL 不在这里配置，见 migrations/env.py（从 .env 读取 DATABASE_URL）。

[alembic]
# 迁移脚本目录，%(here)s = 本 ini 文件所在目录
script_location = %(here)s/migrations
# 把 backend/ 加入 sys.path，保证能 import app
prepend_sys_path = %(here)s
path_separator = os


# 日志配置，仅被 env.py 的 fileConfig 使用。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
