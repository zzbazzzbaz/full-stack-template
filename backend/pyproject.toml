[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + SQLModel 通用后端模板"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.142.2,<0.143",
    "sqlmodel>=0.0.47,<0.1",
    "alembic>=1.20.0,<2",
    "pydantic-settings>=2.15.0,<3",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pyjwt>=2.15.1,<3",
    "apscheduler>=3.11.3,<4",
    "asyncpg>=0.31.0,<0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "httpx>=0.28.1,<0.29",
    "ruff>=0.16.10,<0.17",
    "ty>=0.0.84,<0.1",
    "testcontainers[postgres]>=4.15.0,<5",
    "greenlet>=3.5.6,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "只允许 import sqlmodel；SQLAlchemy 细节收敛在 app/infrastructure/db/{engine,session}.py 与 tests/db.py"

[tool.ruff.lint.per-file-ignores]
"app/infrastructure/db/engine.py" = ["TID251"]
"app/infrastructure/db/session.py" = ["TID251"]
"tests/db.py" = ["TID251"]
# FastAPI 依赖注入固定写法：Depends 必须出现在参数默认值位置
"app/api/dependencies.py" = ["B008"]

[tool.ty.src]
include = ["app", "tests"]

[tool.uv]
package = false
